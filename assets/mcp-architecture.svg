<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
     role="img" aria-label="Architecture: coding agent talks to an MCP server, which reads the Power BI semantic model">

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- agent -->
  <rect x="14" y="82" width="158" height="92" rx="9" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.5"/>
  <text x="93" y="122" text-anchor="middle" font-size="14.5" font-weight="620" fill="#16191d">Coding agent</text>
  <text x="93" y="142" text-anchor="middle" font-size="12.5" fill="#5b646e">Copilot / Claude</text>

  <!-- arrows agent <-> server -->
  <line x1="178" y1="112" x2="252" y2="112" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="215" y="103" text-anchor="middle" font-size="11" fill="#5b646e">tool call</text>

  <line x1="252" y1="146" x2="178" y2="146" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="215" y="163" text-anchor="middle" font-size="11" fill="#5b646e">JSON result</text>

  <!-- mcp server -->
  <rect x="256" y="40" width="206" height="200" rx="9" fill="#f7f9fc" stroke="#1F3864" stroke-width="1.8"/>
  <text x="359" y="66" text-anchor="middle" font-size="14.5" font-weight="620" fill="#1F3864">MCP server</text>
  <line x1="276" y1="78" x2="442" y2="78" stroke="#dbe3ef" stroke-width="1"/>

  <text x="278" y="101" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">list_tables</text>
  <text x="278" y="125" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">describe_table</text>
  <text x="278" y="149" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">list_measures</text>
  <text x="278" y="173" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">get_measure_dax</text>
  <text x="278" y="197" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">run_dax</text>

  <text x="359" y="224" text-anchor="middle" font-size="11" fill="#8b949e">read-only</text>

  <!-- arrow server -> model -->
  <line x1="468" y1="128" x2="542" y2="128" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="505" y="119" text-anchor="middle" font-size="11" fill="#5b646e">XMLA</text>

  <!-- semantic model -->
  <rect x="546" y="62" width="160" height="132" rx="9" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.5"/>
  <text x="626" y="88" text-anchor="middle" font-size="14.5" font-weight="620" fill="#16191d">Semantic model</text>

  <rect x="566" y="102" width="120" height="24" rx="4" fill="#eef2f8" stroke="#dbe3ef"/>
  <text x="626" y="118" text-anchor="middle" font-size="11.5" fill="#1F3864">tables + columns</text>

  <rect x="566" y="132" width="120" height="24" rx="4" fill="#eef2f8" stroke="#dbe3ef"/>
  <text x="626" y="148" text-anchor="middle" font-size="11.5" fill="#1F3864">measures (DAX)</text>

  <rect x="566" y="162" width="120" height="24" rx="4" fill="#eef2f8" stroke="#dbe3ef"/>
  <text x="626" y="178" text-anchor="middle" font-size="11.5" fill="#1F3864">relationships</text>

  <!-- credential note -->
  <line x1="359" y1="252" x2="359" y2="268" stroke="#c9d3e0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="359" y="284" text-anchor="middle" font-size="11.5" fill="#8b949e">credentials live here, never in the conversation</text>

</svg>
