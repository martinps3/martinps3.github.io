<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
     role="img" aria-label="Comparison of an agent guessing at a model versus reading the model first">

  <!-- ============ LEFT: blind ============ -->
  <rect x="8" y="34" width="336" height="282" rx="10" fill="#fffbfa" stroke="#e8c4bd" stroke-width="1.5"/>

  <text x="24" y="22" font-size="12" font-weight="650" fill="#a4453a" letter-spacing="0.5">WITHOUT MODEL ACCESS</text>

  <text x="28" y="62" font-size="12.5" fill="#5b646e">prompt</text>
  <rect x="28" y="70" width="296" height="30" rx="5" fill="#ffffff" stroke="#e8d5d1"/>
  <text x="40" y="90" font-size="12" fill="#16191d">"add an on-time % measure by carrier"</text>

  <line x1="176" y1="104" x2="176" y2="126" stroke="#c9b0ab" stroke-width="1.3"/>
  <polygon points="176,132 172,124 180,124" fill="#c9b0ab"/>

  <text x="28" y="150" font-size="12.5" fill="#5b646e">agent output</text>
  <rect x="28" y="158" width="296" height="80" rx="5" fill="#ffffff" stroke="#e8d5d1"/>
  <text x="40" y="178" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">On Time % =</text>
  <text x="40" y="196" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">DIVIDE(</text>
  <text x="40" y="214" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#a4453a">  SUM(Sales[OnTimeFlag]),</text>
  <text x="40" y="232" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#a4453a">  COUNT(Sales[OrderID]))</text>

  <circle cx="300" cy="212" r="9" fill="#a4453a"/>
  <text x="300" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">!</text>

  <text x="28" y="262" font-size="12" fill="#a4453a">Table is Shipment, not Sales.</text>
  <text x="28" y="280" font-size="12" fill="#a4453a">OnTimeFlag does not exist.</text>
  <text x="28" y="298" font-size="12" fill="#a4453a">A measure already did this.</text>

  <!-- ============ RIGHT: informed ============ -->
  <rect x="376" y="34" width="336" height="282" rx="10" fill="#f9fdfa" stroke="#bcd9c6" stroke-width="1.5"/>

  <text x="392" y="22" font-size="12" font-weight="650" fill="#2f6b46" letter-spacing="0.5">WITH MODEL ACCESS</text>

  <text x="396" y="62" font-size="12.5" fill="#5b646e">agent looks first</text>

  <rect x="396" y="70" width="296" height="22" rx="4" fill="#ffffff" stroke="#cfe4d6"/>
  <text x="406" y="85" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#2f6b46">list_tables()</text>
  <text x="560" y="85" font-size="11" fill="#5b646e">Shipment, Carrier, Date</text>

  <rect x="396" y="96" width="296" height="22" rx="4" fill="#ffffff" stroke="#cfe4d6"/>
  <text x="406" y="111" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#2f6b46">list_measures()</text>
  <text x="560" y="111" font-size="11" fill="#5b646e">On Time % exists</text>

  <rect x="396" y="122" width="296" height="22" rx="4" fill="#ffffff" stroke="#cfe4d6"/>
  <text x="406" y="137" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#2f6b46">get_measure_dax()</text>
  <text x="560" y="137" font-size="11" fill="#5b646e">reads the logic</text>

  <line x1="544" y1="150" x2="544" y2="166" stroke="#a8c9b5" stroke-width="1.3"/>
  <polygon points="544,172 540,164 548,164" fill="#a8c9b5"/>

  <text x="396" y="190" font-size="12.5" fill="#5b646e">agent output</text>
  <rect x="396" y="198" width="296" height="76" rx="5" fill="#ffffff" stroke="#cfe4d6"/>
  <text x="408" y="218" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">On Time % L12M =</text>
  <text x="408" y="236" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">CALCULATE(</text>
  <text x="408" y="254" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#2f6b46">  [On Time %],</text>
  <text x="408" y="268" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#2f6b46">  DATESINPERIOD(...))</text>

  <text x="396" y="298" font-size="12" fill="#2f6b46">Reuses the existing measure. Verified with run_dax.</text>

</svg>
