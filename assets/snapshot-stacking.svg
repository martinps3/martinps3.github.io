  <text x="230" y="226" font-size="11" font-weight="600" fill="#5b646e">Status</text>
  <text x="310" y="226" font-size="11" font-weight="600" fill="#5b646e">Amount</text>

  <text x="22"  y="248" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#5b646e">2025-01</text>
  <text x="140" y="248" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#b0452f">C-1001</text>
  <text x="230" y="248" font-size="11.5" fill="#16191d">Open</text>
  <text x="310" y="248" font-size="11.5" fill="#16191d">4,200</text>

  <text x="22"  y="266" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#5b646e">2025-01</text>
  <text x="140" y="266" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">C-1002</text>
  <text x="230" y="266" font-size="11.5" fill="#16191d">Open</text>
  <text x="310" y="266" font-size="11.5" fill="#16191d">1,150</text>

  <text x="22"  y="284" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#5b646e">2025-02</text>
  <text x="140" y="284" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#b0452f">C-1001</text>
  <text x="230" y="284" font-size="11.5" fill="#16191d">Open</text>
  <text x="310" y="284" font-size="11.5" fill="#16191d">4,200</text>

  <text x="22"  y="302" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#5b646e">2025-02</text>
  <text x="140" y="302" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#16191d">C-1002</text>
  <text x="230" y="302" font-size="11.5" fill="#16191d">Paid</text>
  <text x="310" y="302" font-size="11.5" fill="#16191d">1,150</text>

  <text x="22"  y="320" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#5b646e">2025-03</text>
  <text x="140" y="320" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#b0452f">C-1001</text>
  <text x="230" y="320" font-size="11.5" fill="#16191d">Paid</text>
  <text x="310" y="320" font-size="11.5" fill="#16191d">4,200</text>

  <!-- callout -->
  <rect x="472" y="210" width="238" height="118" rx="8" fill="#ffffff" stroke="#e3e7ec"/>
  <text x="488" y="234" font-size="12.5" font-weight="620" fill="#b0452f">C-1001 counted 3×</text>
  <text x="488" y="258" font-size="12" fill="#5b646e">COUNTROWS = 5</text>
  <text x="488" y="276" font-size="12" fill="#16191d">actual claims = 2</text>
  <line x1="488" y1="288" x2="694" y2="288" stroke="#e3e7ec"/>
  <text x="488" y="306" font-size="12" fill="#5b646e">SUM(Amount) = 14,900</text>
  <text x="488" y="322" font-size="12" fill="#16191d">actual total = 5,350</text>

</svg>
