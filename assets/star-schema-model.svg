<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
     role="img" aria-label="Before and after: one flat stacked table reshaped into a star schema with date, status and carrier dimensions">

  <!-- ================= BEFORE ================= -->
  <text x="10" y="20" font-size="12" font-weight="650" fill="#a4453a" letter-spacing="0.5">BEFORE</text>

  <rect x="10" y="88" width="200" height="120" rx="8" fill="#fffbfa" stroke="#e0b9b0" stroke-width="1.6"/>
  <text x="110" y="114" text-anchor="middle" font-size="13.5" font-weight="620" fill="#16191d">Claims</text>
  <line x1="30" y1="124" x2="190" y2="124" stroke="#efdcd7"/>
  <text x="30" y="142" font-size="11.5" fill="#5b646e">SnapshotMonth  (text)</text>
  <text x="30" y="160" font-size="11.5" fill="#5b646e">ClaimId</text>
  <text x="30" y="178" font-size="11.5" fill="#5b646e">Status</text>
  <text x="30" y="196" font-size="11.5" fill="#5b646e">Amount</text>

  <text x="110" y="232" text-anchor="middle" font-size="11.5" fill="#a4453a">20 snapshots stacked</text>
  <text x="110" y="250" text-anchor="middle" font-size="11.5" fill="#a4453a">no date table</text>
  <text x="110" y="268" text-anchor="middle" font-size="11.5" fill="#a4453a">every count inflated</text>

  <!-- arrow -->
  <line x1="232" y1="148" x2="286" y2="148" stroke="#8b949e" stroke-width="1.6"/>
  <polygon points="294,148 284,143 284,153" fill="#8b949e"/>

  <!-- ================= AFTER ================= -->
  <text x="318" y="20" font-size="12" font-weight="650" fill="#2f6b46" letter-spacing="0.5">AFTER</text>

  <!-- fact -->
  <rect x="452" y="112" width="152" height="96" rx="8" fill="#f7f9fc" stroke="#1F3864" stroke-width="1.8"/>
  <text x="528" y="136" text-anchor="middle" font-size="13" font-weight="620" fill="#1F3864">Fact_Claim</text>
  <line x1="468" y1="146" x2="588" y2="146" stroke="#dbe3ef"/>
  <text x="468" y="163" font-size="11" fill="#5b646e">ClaimId  (1 row)</text>
  <text x="468" y="180" font-size="11" fill="#5b646e">OpenedDate</text>
  <text x="468" y="197" font-size="11" fill="#5b646e">CurrentAmount</text>

  <!-- dim date -->
  <rect x="318" y="40" width="118" height="54" rx="7" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4"/>
  <text x="377" y="62" text-anchor="middle" font-size="12" font-weight="620" fill="#16191d">Dim_Date</text>
  <text x="377" y="80" text-anchor="middle" font-size="10.5" fill="#5b646e">marked as date table</text>

  <!-- dim status -->
  <rect x="318" y="226" width="118" height="54" rx="7" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4"/>
  <text x="377" y="248" text-anchor="middle" font-size="12" font-weight="620" fill="#16191d">Dim_Status</text>
  <text x="377" y="266" text-anchor="middle" font-size="10.5" fill="#5b646e">StatusGroup</text>

  <!-- dim carrier -->
  <rect x="620" y="132" width="92" height="56" rx="7" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4"/>
  <text x="666" y="154" text-anchor="middle" font-size="12" font-weight="620" fill="#16191d">Dim_</text>
  <text x="666" y="170" text-anchor="middle" font-size="12" font-weight="620" fill="#16191d">Carrier</text>

  <!-- relationship lines -->
  <line x1="436" y1="76" x2="478" y2="112" stroke="#9aa7b8" stroke-width="1.4"/>
  <text x="446" y="100" font-size="10" fill="#8b949e">1</text>
  <text x="470" y="112" font-size="10" fill="#8b949e">∗</text>

  <line x1="436" y1="248" x2="478" y2="208" stroke="#9aa7b8" stroke-width="1.4"/>
  <text x="446" y="228" font-size="10" fill="#8b949e">1</text>
  <text x="470" y="210" font-size="10" fill="#8b949e">∗</text>

  <line x1="604" y1="160" x2="620" y2="160" stroke="#9aa7b8" stroke-width="1.4"/>
  <text x="608" y="153" font-size="10" fill="#8b949e">∗</text>
  <text x="614" y="153" font-size="10" fill="#8b949e">1</text>

  <text x="528" y="240" text-anchor="middle" font-size="11.5" fill="#2f6b46">one row per claim</text>
  <text x="528" y="258" text-anchor="middle" font-size="11.5" fill="#2f6b46">COUNTROWS is correct</text>

</svg>
